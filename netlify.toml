[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- CORS for STATIC assets (loader.js, widget.js, chunks/*) -------------------
# NOTE: [[headers]] only apply to static CDN responses. Function responses
# (/api/*) get their CORS headers in code: see netlify/functions/_lib/http.ts
[[headers]]
  for = "/*.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/chunks/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Resource-Policy = "cross-origin"
    Cache-Control = "public, max-age=31536000, immutable"

# loader.js is embedded on client sites: keep it fresh but cheap.
[[headers]]
  for = "/loader.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

[[headers]]
  for = "/widget.js"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
