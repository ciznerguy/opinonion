<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo client site</title>
<style>
  body{font-family:Georgia,serif;margin:0;background:#faf7f2;color:#222}
  header{background:#1f3a2e;color:#fff;padding:28px 6vw}

  h1{margin:0 0 6px} p{line-height:1.65} .btn{display:inline-block;background:#c2410c;color:#fff;padding:10px 18px;border-radius:8px;text-decoration:none}

  <img alt="Sourdough loaf" width="240" height="120" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='120'><rect width='240' height='120' fill='%23fde68a'/><text x='20' y='65' font-size='22'>Loaf photo</text></svg>">

</main>
